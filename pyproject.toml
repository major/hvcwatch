[project]
name = "hvcwatch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Major Hayden", email = "major@mhtx.net" }]
requires-python = ">=3.15,<3.16"
dependencies = [
    "pydantic-settings>=2.16.3",
    "exchange-calendars>=4.13.3",
    "discord-webhook>=1.4.1",
    "imap-tools>=1.16.0",
    "pytest-env>=1.8.5",
    "requests>=2.34.2",
]

[project.scripts]
hvcwatch = "hvcwatch.main:main"

[build-system]
requires = ["uv_build>=0.9.0,<1.0.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=5.1.0",
    "ruff>=0.17.5",
    "ty>=0.0.105",
]

[tool.pytest.ini_options]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-branch",
    "--color=yes",
    "--disable-warnings",
]
# Having problems with tests? Uncomment the following line to see more output.
# log_cli = false
# log_level = "DEBUG"
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
testpaths = ["tests"]
env = [
    "FASTMAIL_USER=test_user",
    "FASTMAIL_PASS=test_password",
    "DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/test",
]

[tool.ruff]
fix = true

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
preview = true
