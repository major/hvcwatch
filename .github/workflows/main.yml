name: Main

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"
          enable-cache: true

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run all tests
        run: make all

  container:
    needs:
      - testing
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: Containerfile
          # 🗄️ Reuse layers (including the uv dependency install) across CI runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}

      - name: Checkout homehosted repository
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: major/homehosted
          token: ${{ secrets.HOMEHOSTED_PAT }}
          path: homehosted

      - name: Configure git
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      # 🚀 Point the homehosted Flux HelmRelease at the new image digest so Flux rolls it out
      - name: Update deployment manifest
        if: github.ref == 'refs/heads/main'
        run: |
          cd homehosted
          DIGEST="${{ steps.build.outputs.digest }}"
          HELMRELEASE=apps/hvcwatch/helm/helmrelease.yaml
          sed -i "s|tag: latest@sha256:[a-f0-9]*|tag: latest@${DIGEST}|" "$HELMRELEASE"

          # 🔍 Fail if the tag line was not found, so a changed file layout cannot pass silently
          grep -qF "tag: latest@${DIGEST}" "$HELMRELEASE" || {
            echo "::error::No 'tag: latest@sha256:' line found in $HELMRELEASE"
            exit 1
          }

          if git diff --quiet "$HELMRELEASE"; then
            echo "No changes to $HELMRELEASE, skipping commit"
            exit 0
          fi

          git add "$HELMRELEASE"
          git commit -m "🤖 Update hvcwatch deployment to ${DIGEST}"
          git push
